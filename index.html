<head>

<meta name="theme-color" content="#1976d2">

<style>
*{box-sizing:border-box}

body{

}

header{
 background:#1976d2;

 text-align:center;
}

header h1{

 font-size:22px;
}

header p{
 margin:6px 0 0;
 font-size:13px;
}

.tabs{

 position:sticky;

 font-size:15px;
 font-weight:bold;
}

.tab.active{

}

.container{
 padding:15px;
 max-width:600px;
 margin:auto;
}

.search{
 width:100%;

 border-radius:12px;
 font-size:16px;
 margin-bottom:12px;
}

.card{
 background:white;
 border-radius:15px;
 padding:16px;
 margin-bottom:12px;
 box-shadow:0 2px 7px #0001;
}

.card h2{
 margin:0 0 8px;
 font-size:18px;
}

.area{
 color:#777;
 font-size:13px;
 margin-bottom:10px;
}

.badge{
 display:inline-block;
 background:#e53935;
 color:white;
 padding:5px 9px;
 border-radius:8px;
 font-size:12px;
 font-weight:bold;
 margin-bottom:8px;
}

.period{
 font-size:14px;
 margin:5px 0 12px;
 color:#555;
}

button.action{
 border:0;
 border-radius:10px;
 padding:11px 14px;
 font-size:14px;
 font-weight:bold;
}

.view{
 background:#1976d2;
 color:white;
}

.add{
 background:#43a047;
 color:white;
 float:right;
}

.delete{
 background:#eee;
 color:#555;
 margin-top:10px;
 width:100%;
}

.empty{
 text-align:center;
 padding:40px 10px;
 color:#777;
}

.hidden{
 display:none;
}

.note{
 background:#fff8e1;
 border-left:5px solid #ffb300;
 padding:12px;
 border-radius:8px;
 font-size:13px;
 margin-bottom:15px;
}
</style>
</head>

</header>

</div>

<div class="container">

<section id="my">

<div class="note">

<div id="myStores"></div>

</section>


<!-- お店を追加 -->
<section id="add" class="hidden">

<input
 id="search"
 class="search"
 placeholder="🔎 お店を検索（例：ベルク）"

<div id="storeResults"></div>

</section>

</div>
