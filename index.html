<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>羽生チラシ</title>

<style>
body{

}
header{
 background:#1976d2;
 color:white;

}
header h1{margin:0;font-size:25px}
header p{margin:6px 0 0}

nav{
 display:flex;
 background:white;
 box-shadow:0 2px 5px #aaa;
}
nav button{
 width:50%;
 padding:17px 5px;
 border:0;
 background:white;
 font-size:16px;
 font-weight:bold;
}
nav button.active{
 color:#1976d2;
 border-bottom:4px solid #1976d2;
}

main{

 margin:auto;
 padding:15px;
}

.card{

 padding:16px;
 margin-bottom:14px;
 box-shadow:0 2px 7px #bbb;
}

.card h2{

}

.area{

.new{

 border-radius:7px;

 margin-bottom:10px;
}

.action{
 width:100%;
 padding:14px;
 border:0;
 border-radius:9px;

 font-size:16px;
 font-weight:bold;
}

.view{
 background:#1976d2;
 color:white;
}

.add{
 background:#43a047;
 color:white;
}

.remove{
 background:#eee;
 color:#555;
}

.search{
 width:100%;
 padding:14px;
 box-sizing:border-box;
 border:1px solid #ccc;
 border-radius:10px;
 font-size:17px;
 margin-bottom:15px;
}
</style>
</head>

 showMyStores();

addButton.onclick = function(){

};

 myList.innerHTML="";

  myList.innerHTML=
  '<div class="card">登録されているお店はありません。</div>';

  return;

    myList.innerHTML +=

    '<div class="card">'+

    '🗑️ マイ店舗から削除'+
    '</button>'+

    '</div>';
   }
  }
 }
}

   stores[i].name.toLowerCase().indexOf(word)==-1
  ){
   continue;
  }

  var registered=
   myStores.indexOf(stores[i].id)!=-1;

  storeList.innerHTML +=

  '<div class="card">'+

  '<h2>🏪 '+stores[i].name+'</h2>'+

  '<div class="area">📍 '+stores[i].area+'</div>'+

  (
   registered
   ?
   '<p>✅ マイ店舗に登録済み</p>'

   '<button class="action add" '+
   'onclick="addStore(\''+stores[i].id+'\')">'+
   '＋ マイ店舗に追加'+
   '</button>'
  )+

  '</div>';
 }
}
