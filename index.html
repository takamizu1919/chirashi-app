<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羽生チラシ</title>

<style>
body{
 margin:0;
 font-family:Arial,"Noto Sans JP",sans-serif;
 background:#f3f5f7;
 color:#222;
}
header{
 background:#1976d2;
 color:white;
 text-align:center;
 padding:18px;
}
header h1{margin:0}
header p{margin:6px 0}
nav{display:flex;background:white}
nav button{
 width:50%;
 padding:17px 5px;
 border:0;
 background:white;
 font-size:16px;
 font-weight:bold;
}
nav button.active{
 color:#1976d2;
 border-bottom:4px solid #1976d2;
}
main{max-width:600px;margin:auto;padding:15px}
.card{
 background:white;
 border-radius:14px;
 padding:16px;
 margin-bottom:14px;
 box-shadow:0 2px 7px #bbb;
}
.card h2{margin:0 0 8px;font-size:19px}
.area{color:#777;margin-bottom:12px}
.action{
 width:100%;
 padding:14px;
 margin-top:8px;
 border:0;
 border-radius:9px;
 font-size:16px;
 font-weight:bold;
}
.flyer{background:#1976d2;color:white}
.add{background:#43a047;color:white}
.remove{background:#eee;color:#555}
</style>
</head>

<body>

<header>
<h1>📰 羽生チラシ</h1>
<p>羽生市のお店のチラシ</p>
</header>

<nav>
<button id="myBtn" class="active">⭐ マイ店舗</button>
<button id="addBtn">🔎 お店を追加</button>
</nav>

<main>

<div id="myPage">
<h2>⭐ マイ店舗</h2>
<div id="myList"></div>
</div>

<div id="addPage" style="display:none">
<h2>🔎 お店を追加</h2>
<div id="storeList"></div>
</div>

</main>

<script>

var stores=[

{
id:"yaoko",
name:"ヤオコー羽生店",
area:"羽生市南4-255",
url:"https://www.yaoko-net.com/store/store01/058.html"
},

{
id:"beisia",
name:"ベイシア羽生店",
area:"羽生市中岩瀬700",
url:"https://chirashi.line.me/branches/5da85a26fd8da8d8d9475899"
},

{
id:"cainz",
name:"カインズ羽生店",
area:"羽生市大字小松388",
url:"https://map.cainz.com/detail/860/"
},

{
id:"belc",
name:"ベルク羽生西店",
area:"羽生市西2-18-19",
url:"https://www.belc.jp/shop/0029"
}

];

var myStores=["yaoko","beisia","cainz"];

var myBtn=document.getElementById("myBtn");
var addBtn=document.getElementById("addBtn");
var myPage=document.getElementById("myPage");
var addPage=document.getElementById("addPage");

myBtn.onclick=function(){
 myPage.style.display="block";
 addPage.style.display="none";
 myBtn.className="active";
 addBtn.className="";
 showMy();
};

addBtn.onclick=function(){
 myPage.style.display="none";
 addPage.style.display="block";
 myBtn.className="";
 addBtn.className="active";
 showAll();
};

function showMy(){

 var box=document.getElementById("myList");
 box.innerHTML="";

 for(var i=0;i<myStores.length;i++){

  var shop=findShop(myStores[i]);

  if(shop){

   box.innerHTML+=
   '<div class="card">'+
   '<h2>🏪 '+shop.name+'</h2>'+
   '<div class="area">📍 '+shop.area+'</div>'+
   '<button class="action flyer" onclick="openFlyer(\''+
   shop.url+'\')">'+
   '📰 '+shop.name+'のチラシを見る'+
   '</button>'+
   '<button class="action remove" onclick="removeShop(\''+
   shop.id+'\')">'+
   '🗑️ マイ店舗から削除'+
   '</button>'+
   '</div>';
  }
 }
}

function showAll(){

 var box=document.getElementById("storeList");
 box.innerHTML="";

 for(var i=0;i<stores.length;i++){

  var shop=stores[i];
  var registered=myStores.indexOf(shop.id)>=0;

  box.innerHTML+=
  '<div class="card">'+
  '<h2>🏪 '+shop.name+'</h2>'+
  '<div class="area">📍 '+shop.area+'</div>'+
  (
   registered
   ? '<p>✅ 登録済み</p>'
   : '<button class="action add" onclick="addShop(\''+
     shop.id+'\')">＋ マイ店舗に追加</button>'
  )+
  '</div>';
 }
}

function findShop(id){

 for(var i=0;i<stores.length;i++){
  if(stores[i].id==id)return stores[i];
 }

 return null;
}

function addShop(id){

 if(myStores.indexOf(id)<0){
  myStores.push(id);
 }

 myPage.style.display="block";
 addPage.style.display="none";
 myBtn.className="active";
 addBtn.className="";
 showMy();
}

function removeShop(id){

 var result=[];

 for(var i=0;i<myStores.length;i++){
  if(myStores[i]!=id)result.push(myStores[i]);
 }

 myStores=result;
 showMy();
}

function openFlyer(url){
 window.open(url,"_blank");
}

showMy();

</script>

</body>
</html>
